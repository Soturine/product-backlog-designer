[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "product-backlog-designer"
version = "0.1.0.dev0"
description = "Agent-led, local-first runtime contracts for evidence-backed product backlogs (pre-alpha)."
readme = "README.md"
requires-python = ">=3.11"
# License intentionally not declared: repository license selection is pending owner decision.
dependencies = ["jsonschema>=4.21,<5"]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.5", "mypy>=1.10", "types-jsonschema", "coverage>=7"]

[project.scripts]
pbd = "pbd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pbd = ["schemas/v1/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra --strict-markers"
markers = ["property: hypothesis property tests", "playwright: browser tests (offline, system Edge/Chrome)", "security: security and privacy tests", "contract: schema/contract tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B017"]
"src/pbd/render/report_html.py" = ["E501"]  # embedded HTML/CSS/JS template text

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["pbd"]
